<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safe Zones</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <span class="title">Safe Zones</span>
  <span id="host" class="badge">-</span>
</header>

<div class="preview"><img id="preview" alt="Overlay preview"></div>

<section class="buttons">
  <button class="plat" data-p="reels"><i></i>Reels</button>
  <button class="plat" data-p="tiktok"><i></i>TikTok</button>
  <button class="plat" data-p="shorts"><i></i>Shorts</button>
</section>

<section class="opts">
  <label for="style">Style</label>
  <select id="style">
    <option value="zones">Safe-zone shading</option>
    <option value="ui">App UI icons (wireframe)</option>
    <option value="both">Both</option>
  </select>
</section>

<section class="opts">
  <label for="color">Color</label>
  <select id="color">
    <option value="">Default (pink / white)</option>
    <option value="#FFFFFF">White</option>
    <option value="#000000">Black</option>
    <option value="#FFE600">Yellow</option>
    <option value="#39FF88">Green</option>
    <option value="#00D2FF">Cyan</option>
    <option value="custom">Custom hex...</option>
  </select>
</section>
<section class="opts" id="hexrow" style="display:none">
  <label for="hex">Hex</label>
  <input id="hex" type="text" maxlength="7" value="#FF8800" spellcheck="false">
</section>

<section class="opts">
  <label for="variant">Zones</label>
  <select id="variant">
    <option value="official">Official ad guide (safest)</option>
    <option value="organic">Organic, measured in app</option>
  </select>
</section>

<section class="actions">
  <button id="remove" class="ghost">Remove overlay</button>
</section>

<div id="live" class="live" style="display:none">OVERLAY IS ON THE TIMELINE - it will render in your export. Click the active button to hide it.</div>
<p id="status" class="status">Ready.</p>
<p id="warn" class="warn"></p>

<script src="js/zones.js"></script>
<script src="js/overlay.js"></script>
<script src="js/cep-bridge.js"></script>
<script src="js/main.js"></script>
</body>
</html>
